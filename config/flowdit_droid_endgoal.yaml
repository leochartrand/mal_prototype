# Architecture: DiT-Air d18 w896 shared AdaLN (185M) — Round 3 winner
# Timestep distribution: t = α·u / (1 + (α-1)·u), α = sqrt(N·D/4096) ≈ 4.29
# Shifts training toward high-noise (t≈1) regime.

dataset_path: "../../../mnt/sda1/Datasets/chal2525/mmap_data/"
model_path: "models/flowdit_droid_endgoal/model.pt"
results_path: "results/flowdit/"

vision_model: "theia_small_cdiv"
text_model: "all-MiniLM-L6-v2"

theia_decoder:
  model_path: "models/theia_decoder/small_cdiv/model.pt"
  model_params:
    ch_mult: [1, 1, 2, 2, 4]
    channels: 64
    z_channels: 128
    dropout: 0.0
    theia_dim: 384

model_params:
  model_type: "dit_air"
  latent_dim: 384
  num_patches: 196
  hidden_dim: 896
  depth: 18
  num_heads: 14
  mlp_ratio: 4.0
  dropout: 0.1
  use_pooled_text: true
  cfg_drop_prompt: 0.05
  cfg_drop_context: 0.05
  cfg_drop_both: 0.05

scale_factor: 1.702949
timestep_distribution: "rae_shift"

batch_size: 32
num_epochs: 20
patience: 5
lr: 1e-4
weight_decay: 0.01
grad_clip: 1.0
warmup_steps: 2000

use_ema: false
gradient_checkpointing: false
resume_from_checkpoint: true

sample_steps: 4
cfg_ctx: 2.5
cfg_prompt: 6.0
